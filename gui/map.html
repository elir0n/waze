<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
html, body, #map { height:100%; margin:0; }

#metrics {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 1000;
    background: rgba(20,20,20,0.82);
    color: #fff;
    font: 14px/1.6 monospace;
    padding: 10px 16px;
    border-radius: 8px;
    min-width: 180px;
    pointer-events: none;
}
#metrics h3 {
    margin: 0 0 6px;
    font-size: 13px;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: #aaa;
}
.metric-row { display: flex; justify-content: space-between; gap: 16px; }
.metric-val { font-weight: bold; }
.m-driving { color: #4fc3f7; }
.m-arrived { color: #81c784; }
.m-waiting { color: #ffb74d; }
.m-total   { color: #e0e0e0; }

#legend {
    position: fixed;
    bottom: 28px;
    right: 12px;
    z-index: 1000;
    background: rgba(20,20,20,0.82);
    color: #fff;
    font: 12px/1.6 monospace;
    padding: 8px 14px;
    border-radius: 8px;
    pointer-events: none;
}
#legend h3 {
    margin: 0 0 4px;
    font-size: 11px;
    text-transform: uppercase;
    color: #aaa;
}
.legend-row { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
.legend-swatch {
    width: 28px;
    height: 5px;
    border-radius: 2px;
    display: inline-block;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="metrics">
    <h3>Live Traffic</h3>
    <div class="metric-row"><span>🚗 Driving</span> <span class="metric-val m-driving" id="m-driving">—</span></div>
    <div class="metric-row"><span>✅ Arrived</span> <span class="metric-val m-arrived" id="m-arrived">—</span></div>
    <div class="metric-row"><span>⏳ Waiting</span> <span class="metric-val m-waiting" id="m-waiting">—</span></div>
    <div class="metric-row" style="border-top:1px solid #444;margin-top:4px;padding-top:4px">
        <span>Total</span> <span class="metric-val m-total" id="m-total">—</span>
    </div>
</div>

<div id="legend">
    <h3>Road congestion</h3>
    <div class="legend-row"><span class="legend-swatch" style="background:#ff8c00"></span> Light</div>
    <div class="legend-row"><span class="legend-swatch" style="background:#ff4500"></span> Moderate</div>
    <div class="legend-row"><span class="legend-swatch" style="background:#cc0000"></span> Heavy</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([32.0853,34.7818],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19
}).addTo(map);

/* ── car markers ── */
const cars = {};
const carRenderer = L.canvas({ padding: 0.5 });

function markerStyle(state) {
    const styles = {
        driving: { color: '#1e88e5', fillColor: '#4fc3f7', radius: 4.5, fillOpacity: 0.9, weight: 1.2 },
        arrived: { color: '#2e7d32', fillColor: '#81c784', radius: 4.0, fillOpacity: 0.85, weight: 1.2 },
        idle:    { color: '#ef6c00', fillColor: '#ffb74d', radius: 3.5, fillOpacity: 0.75, weight: 1.0 }
    };
    return styles[state] || styles.driving;
}

function updateCar(id, lat, lon, state) {
    const style = markerStyle(state);
    if (!cars[id]) {
        cars[id] = {
            marker: L.circleMarker([lat, lon], { ...style, renderer: carRenderer }).addTo(map),
            state
        };
        return;
    }

    cars[id].marker.setLatLng([lat, lon]);
    if (cars[id].state !== state) {
        cars[id].marker.setStyle(style);
        cars[id].state = state;
    }
}

function fetchPositions() {
    fetch("http://localhost:8090/positions")
        .then(function(r){ return r.json(); })
        .then(function(data) {
            const seen = new Set();
            (data.positions || []).forEach(function(p) {
                updateCar(p.car_id, p.lat, p.lon, p.state || 'driving');
                seen.add(p.car_id);
            });
            // remove markers for cars no longer reported
            Object.keys(cars).forEach(function(id) {
                if (!seen.has(Number(id))) {
                    cars[id].marker.remove();
                    delete cars[id];
                }
            });
        })
        .catch(function(){});
}

/* ── edge layer (all roads) + congestion overlay ── */
const edgeLayer = new Map();   // edge_id → { polyline, speed, lanes, rtype }
let prevCongested = new Set();

function jamColor(occ, cap) {
    const ratio = Math.min(occ / Math.max(cap, 1), 1.0);
    // hue: 30 (orange) → 0 (red) as ratio goes 0→1
    const hue = Math.round((1 - ratio) * 30);
    const lightness = 45;
    return `hsl(${hue},100%,${lightness}%)`;
}

function buildTooltip(speed, lanes, rtype, cars) {
    return `<div style="font:12px monospace;line-height:1.7">` +
           `<b>${rtype}</b><br>` +
           `Speed: ${speed} km/h<br>` +
           `Lanes: ${lanes}<br>` +
           `Cars: ${cars}</div>`;
}

function initEdgeLayer() {
    fetch("http://localhost:8090/edges")
        .then(r => r.json())
        .then(data => {
            (data.edges || []).forEach(e => {
                const pl = L.polyline(
                    [[e.flat, e.flon], [e.tlat, e.tlon]],
                    { color: '#888', weight: 3, opacity: 0.5, interactive: true }
                ).addTo(map);
                pl.bindTooltip(buildTooltip(e.speed, e.lanes, e.rtype, 0),
                               { sticky: true, opacity: 0.92 });
                edgeLayer.set(e.id, { polyline: pl, speed: e.speed,
                                      lanes: e.lanes, rtype: e.rtype });
            });
            console.log(`[map] ${edgeLayer.size} edges loaded`);
        })
        .catch(err => console.warn('[map] /edges failed:', err));
}

function fetchCongestion() {
    fetch("http://localhost:8090/congestion")
        .then(r => r.json())
        .then(data => {
            const now = new Set();
            (data.congestion || []).forEach(e => {
                now.add(e.id);
                const entry = edgeLayer.get(e.id);
                if (!entry) return;
                entry.polyline.setStyle({
                    color: jamColor(e.occ, e.cap),
                    weight: Math.min(2 + e.occ, 8),
                    opacity: 0.85
                });
                entry.polyline.setTooltipContent(
                    buildTooltip(entry.speed, entry.lanes, entry.rtype, e.occ));
                entry.polyline.bringToFront();
            });
            // Reset edges that dropped out of congestion since last tick
            prevCongested.forEach(id => {
                if (!now.has(id)) {
                    const entry = edgeLayer.get(id);
                    if (entry) {
                        entry.polyline.setStyle({ color: '#888', weight: 1.5, opacity: 0.35 });
                        entry.polyline.setTooltipContent(
                            buildTooltip(entry.speed, entry.lanes, entry.rtype, 0));
                    }
                }
            });
            prevCongested = now;
        })
        .catch(() => {});
}

/* ── metrics panel ── */
function fetchMetrics() {
    fetch("http://localhost:8090/metrics")
        .then(function(r){ return r.json(); })
        .then(function(d) {
            document.getElementById('m-driving').textContent = d.driving;
            document.getElementById('m-arrived').textContent = d.arrived;
            document.getElementById('m-waiting').textContent = d.waiting;
            document.getElementById('m-total'  ).textContent = d.total;
        })
        .catch(function(){});
}

/* ── polling ── */
initEdgeLayer();       // async one-time fetch of all road geometries
fetchPositions();
fetchCongestion();
fetchMetrics();

setInterval(fetchPositions,  500);
setInterval(fetchCongestion, 500);
setInterval(fetchMetrics,    500);

</script>

</body>
</html>
